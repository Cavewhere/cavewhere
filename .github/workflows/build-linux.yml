name: Build on Linux

on:
  push:
    branches:
      - master
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - arch: arm64
            runs_on: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            ninja-build \
            pipx \
            liblocale-po-perl \
            git \
            patchelf \
            pkg-config \
            libsecret-1-dev \
            libpng-dev \
            libjpeg-dev \
            libgpgme-dev \
            libgcrypt20-dev \
            libglib2.0-dev \
            libcurl4-openssl-dev \
            squashfs-tools \
            desktop-file-utils

      # Qt's x86_64 desktop binaries are built on RHEL 9.6, where libtiff has the
      # soname libtiff.so.5, so its qtiff plugin needs that library. Ubuntu 24.04
      # ships only libtiff.so.6, so linuxdeploy-plugin-qt fails the build with
      # "Could not find dependency: libtiff.so.5". Install jammy's libtiff5 so the
      # plugin resolves and linuxdeploy bundles the matching library into the
      # AppImage — end users on Ubuntu 24.04 lack it too. Every TIFF symbol the
      # plugin imports is exported by libtiff 4.3.0. The arm64 Qt binaries are
      # built on Ubuntu 24.04 and already link the libtiff.so.6 the runner has.
      - name: Install libtiff.so.5 for the Qt TIFF plugin
        if: matrix.arch == 'x86_64'
        run: |
          LIBTIFF5_DEB=libtiff5_4.3.0-6ubuntu0.13_amd64.deb
          curl -fsSL -o "$LIBTIFF5_DEB" \
            "http://archive.ubuntu.com/ubuntu/pool/main/t/tiff/$LIBTIFF5_DEB"
          sudo apt-get install -y "./$LIBTIFF5_DEB"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        env:
          AQT_CONFIG: ${{ github.workspace }}/.github/aqt.ini
        with:
          aqtversion: '==3.3.*'
          version: '6.11.1'
          host: ${{ matrix.qt_host }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtshadertools qtcanvaspainter qtpdf qtimageformats'

      - name: Install Conan
        run: pipx install conan

      - name: Check Conan Version
        run: conan --version

      - name: Configure Conan Profile
        run: conan profile detect --force

      - name: Add CMake tool requirement
        run: |
          PROFILE_PATH="$(conan config home)/profiles/default"
          echo >> "$PROFILE_PATH"
          echo "[tool_requires]" >> "$PROFILE_PATH"
          echo "!cmake/*: cmake/[>=3 <4]" >> "$PROFILE_PATH"

      - name: Cache Conan Packages
        uses: actions/cache@v5
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-${{ matrix.arch }}-conan-${{ hashFiles('conanfile.*') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-conan-

      - name: Install Dependencies with Conan
        run: |
          conan install . --build=missing --output-folder=build \
          -s compiler.cppstd=17 \
          -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

      - name: Configure the Project with CMake
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTING=OFF \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.11.1/${{ matrix.qt_dir }}/lib \
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -S . -B build

      - name: Build AppImage
        run: cmake --build build --target appimageInstaller

      - name: Get Git tag
        id: git_tag
        run: echo "tag=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: CaveWhere-AppImage-${{ matrix.arch }}-${{ steps.git_tag.outputs.tag }}
          path: build/appimage/*.AppImage
