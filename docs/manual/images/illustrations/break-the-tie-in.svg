<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 330" width="512" height="330" role="img" aria-label="Two plan views of the same small cave. On the left, trip 2's last station reads A2, so the solver hauls that whole run up to meet A2 and the loop closes badly. On the right, the same station now reads A2x; the junction breaks, the run stays anchored at A1 and swings out to where its own shots put it, and its free end lands beside A4, the station it belongs on.">
  <defs>
    <style>
      .card    { fill: #ffffff; }
      .title   { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #171b20; }
      .sub     { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #171b20; }
      .note    { font: 11px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #5c656e; }
      .tag     { font: 600 10px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #171b20; }
      .tagb    { font: 600 10px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #17618f; }
      .dim     { font: 600 10px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #d6552b; }
      .trip1   { fill: none; stroke: #171b20; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
      .trip2   { fill: none; stroke: #17618f; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
      .stn1    { fill: #171b20; }
      .stn2    { fill: #17618f; }
      .free    { fill: #ffffff; stroke: #17618f; stroke-width: 2; }
      .ring    { fill: none; stroke: #d6552b; stroke-width: 1.8; }
      .guide   { fill: none; stroke: #d6552b; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .rule    { stroke: #dfe4e8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="card" width="512" height="330"/>
  <text class="title" x="16" y="22">Break a tie-in to find the station a run really meets</text>

  <g transform="translate(352,14)">
    <line class="trip1" x1="0" y1="4" x2="20" y2="4"/>
    <text class="tag" x="26" y="8">trip 1</text>
    <line class="trip2" x1="66" y1="4" x2="86" y2="4"/>
    <text class="tagb" x="92" y="8">trip 2</text>
  </g>

  <line class="rule" x1="256" y1="36" x2="256" y2="316"/>

  <g transform="translate(16,36)">
    <text class="sub" x="0" y="12">1. Tied in at the wrong station</text>

    <path class="trip1" d="M 30 44 L 132 70 L 188 144 L 120 196"/>
    <path class="trip2" d="M 30 44 L 54 92 L 98 100 L 132 70"/>

    <circle class="stn1" cx="30" cy="44" r="4.5"/>
    <circle class="stn1" cx="132" cy="70" r="4"/>
    <circle class="stn1" cx="188" cy="144" r="4"/>
    <circle class="stn1" cx="120" cy="196" r="4"/>
    <circle class="stn2" cx="54" cy="92" r="3.5"/>
    <circle class="stn2" cx="98" cy="100" r="3.5"/>
    <circle class="ring" cx="132" cy="70" r="9"/>

    <text class="tag" x="22" y="38" text-anchor="end">A1</text>
    <text class="tag" x="146" y="62">A2</text>
    <text class="tag" x="196" y="148">A3</text>
    <text class="tag" x="130" y="208">A4</text>
    <text class="tagb" x="44" y="90" text-anchor="end">B1</text>
    <text class="tagb" x="98" y="116" text-anchor="middle">B2</text>

    <text class="note" x="0" y="252">Trip 2's last station reads A2, so cavern</text>
    <text class="note" x="0" y="266">honors the join and hauls the whole run up</text>
    <text class="note" x="0" y="280">to reach it. The loop closes badly.</text>
  </g>

  <g transform="translate(276,36)">
    <text class="sub" x="0" y="12">2. Break the tie and look again</text>

    <path class="trip1" d="M 30 44 L 132 70 L 188 144 L 120 196"/>
    <path class="trip2" d="M 30 44 L 36 112 L 62 172 L 96 214"/>
    <line class="guide" x1="96" y1="214" x2="120" y2="196"/>

    <circle class="stn1" cx="30" cy="44" r="4.5"/>
    <circle class="stn1" cx="132" cy="70" r="4"/>
    <circle class="stn1" cx="188" cy="144" r="4"/>
    <circle class="stn1" cx="120" cy="196" r="4"/>
    <circle class="stn2" cx="36" cy="112" r="3.5"/>
    <circle class="stn2" cx="62" cy="172" r="3.5"/>
    <circle class="free" cx="96" cy="214" r="4.5"/>
    <circle class="ring" cx="120" cy="196" r="9"/>

    <text class="tag" x="22" y="38" text-anchor="end">A1</text>
    <text class="tag" x="146" y="62">A2</text>
    <text class="tag" x="196" y="148">A3</text>
    <text class="tag" x="136" y="192">A4</text>
    <text class="tagb" x="28" y="112" text-anchor="end">B1</text>
    <text class="tagb" x="54" y="176" text-anchor="end">B2</text>
    <text class="tagb" x="90" y="230" text-anchor="middle">A2x</text>
    <text class="dim" x="130" y="222">nearest</text>

    <text class="note" x="0" y="252">Rename it A2x. The junction breaks, the run</text>
    <text class="note" x="0" y="266">swings to where its own shots put it, and the</text>
    <text class="note" x="0" y="280">free end lands nearest A4. So A4 is the name.</text>
  </g>
</svg>
